services:
  app:
    build: .
    container_name: promptvault
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      SITE_NAME: PromptVault
      PORT: "3000"
      ADMIN_USERNAME: admin
      UPLOAD_MAX_MB: "10"
      COOKIE_SECURE: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
